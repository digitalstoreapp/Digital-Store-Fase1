name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'   # cada 3 días, a las 12:00 UTC
  workflow_dispatch:          # permite ejecutarlo manualmente con el botón "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://rdeiiinhfuecrilfwhvv.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: sb_publishable_MIytGC3oHlT3QY6P4scZRg_RIV1Tswn" \
            -H "Authorization: Bearer sb_publishable_MIytGC3oHlT3QY6P4scZRg_RIV1Tswn"
