name: Actualizar version.json

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'

# Necesario para que la Action pueda subir el cambio de version.json de vuelta al repo
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Escribir version.json con la fecha/hora y el commit actuales
        run: |
          echo "{\"v\": \"$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}\"}" > version.json

      - name: Confirmar y subir el cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "Actualizar version.json [skip ci]"
          git push
